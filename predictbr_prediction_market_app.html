
<style>
*{box-sizing:border-box;margin:0;padding:0}
.pm{font-family:var(--font-sans);position:relative;min-height:600px}
.pnav{display:flex;align-items:center;padding:10px 16px;border-bottom:.5px solid var(--color-border-tertiary);gap:6px;flex-wrap:wrap;background:var(--color-background-primary)}
.plogo{font-size:15px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:6px;margin-right:4px}
.plogo-dot{width:10px;height:10px;border-radius:50%;background:#7F77DD;flex-shrink:0}
.ptab{padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--color-text-secondary);font-family:inherit}
.ptab:hover,.ptab.on{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.pnav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pbadge{font-size:12px;font-weight:500;padding:4px 10px;border-radius:8px;background:#E1F5EE;border:.5px solid #5DCAA5;color:#085041}
.pwbtn{font-size:12px;padding:5px 10px;border-radius:8px;border:.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);cursor:pointer;font-family:inherit}
.psearch{padding:10px 16px;border-bottom:.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;gap:8px}
.sinput{width:100%;padding:7px 12px;border-radius:8px;border:.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:inherit;outline:none}
.sinput::placeholder{color:var(--color-text-tertiary)}
.sinput:focus{border-color:var(--color-border-primary)}
.cats{display:flex;gap:5px;flex-wrap:wrap}
.cat{padding:4px 10px;border-radius:100px;font-size:12px;cursor:pointer;border:.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);font-family:inherit}
.cat:hover{background:var(--color-background-secondary)}
.cat.on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:12px 16px}
.mcard{border:.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;cursor:pointer;background:var(--color-background-primary);transition:transform .1s,border-color .15s}
.mcard:hover{transform:translateY(-1px);border-color:var(--color-border-secondary)}
.mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mcb{font-size:10px;font-weight:500;padding:2px 7px;border-radius:100px}
.mcb.pol{background:#EEEDFE;color:#3C3489}.mcb.esp{background:#E1F5EE;color:#085041}
.mcb.cri{background:#FAEEDA;color:#633806}.mcb.fin{background:#E6F1FB;color:#0C447C}
.mcb.tec{background:#FAECE7;color:#4A1B0C}.mcb.sci{background:#FBEAF0;color:#4B1528}
.mc-live{font-size:10px;color:var(--color-text-tertiary)}
.mc-q{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.4;margin-bottom:10px;min-height:40px}
.mc-bar{height:4px;background:var(--color-border-tertiary);border-radius:2px;margin-bottom:8px;overflow:hidden}
.mc-fill{height:100%;border-radius:2px;background:#1D9E75}
.mc-bot{display:flex;justify-content:space-between;align-items:baseline}
.mc-yes{font-size:15px;font-weight:500;color:#1D9E75}
.mc-no{font-size:12px;color:var(--color-text-tertiary);margin-left:4px}
.mc-vol{font-size:11px;color:var(--color-text-tertiary)}
.dback{padding:10px 16px;border-bottom:.5px solid var(--color-border-tertiary);font-size:13px;color:var(--color-text-secondary);cursor:pointer}
.dback:hover{color:var(--color-text-primary)}
.dhead{padding:14px 16px;border-bottom:.5px solid var(--color-border-tertiary)}
.dq{font-size:16px;font-weight:500;color:var(--color-text-primary);line-height:1.4;margin-bottom:8px}
.dmeta{display:flex;gap:10px;font-size:12px;color:var(--color-text-tertiary);flex-wrap:wrap;align-items:center}
.dyp{font-size:14px;font-weight:500;color:#1D9E75}
.dnp{font-size:12px;color:#D85A30}
.dbody{display:grid;grid-template-columns:1fr 245px}
.dleft{padding:12px 16px;border-right:.5px solid var(--color-border-tertiary)}
.dright{padding:12px}
.slbl{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);margin-bottom:8px}
.tbrow{display:flex;gap:4px;margin-bottom:10px}
.tbtn{padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer;border:.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-tertiary);font-family:inherit}
.tbtn.on{background:var(--color-background-secondary);color:var(--color-text-primary)}
.chart-c{height:140px;margin-bottom:14px}
.ob-hd{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:10px;color:var(--color-text-tertiary);margin-bottom:3px;padding:0 2px}
.ob-hd span:last-child{text-align:right}
.obr{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;padding:2px 2px;border-radius:3px;cursor:default}
.obr:hover{background:var(--color-background-secondary)}
.obr span:last-child{text-align:right}
.oask{color:#D85A30;font-weight:500}.obid{color:#1D9E75;font-weight:500}
.obmid{text-align:center;font-size:11px;font-weight:500;padding:5px;color:var(--color-text-secondary);border-top:.5px solid var(--color-border-tertiary);border-bottom:.5px solid var(--color-border-tertiary);margin:3px 0}
.trtype{display:flex;border-radius:8px;overflow:hidden;border:.5px solid var(--color-border-secondary);margin-bottom:10px}
.trt{flex:1;padding:6px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;background:transparent;color:var(--color-text-secondary)}
.trt.on{background:var(--color-background-secondary);color:var(--color-text-primary)}
.outcomes{display:flex;gap:6px;margin-bottom:10px}
.out{flex:1;padding:7px;text-align:center;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid;font-family:inherit;background:transparent;transition:all .15s}
.out.yes{border-color:#5DCAA5;color:#085041}
.out.yes.on{background:#1D9E75;border-color:#1D9E75;color:#fff}
.out.no{border-color:#F0997B;color:#993C1D}
.out.no.on{background:#D85A30;border-color:#D85A30;color:#fff}
.flbl{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.finput{width:100%;padding:8px 10px;border-radius:8px;border:.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:13px;font-family:inherit;outline:none;margin-bottom:6px}
.finput:focus{border-color:#1D9E75}
.qbtns{display:flex;gap:4px;margin-bottom:10px}
.qb{padding:3px 7px;border-radius:6px;font-size:11px;border:.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;font-family:inherit}
.qb:hover{background:var(--color-background-secondary)}
.tsumm{background:var(--color-background-secondary);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.trow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.tl{color:var(--color-text-tertiary)}.tv{color:var(--color-text-primary);font-weight:500}
.bbtn{width:100%;padding:10px;border-radius:10px;font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:inherit;color:#fff}
.bbtn.yes{background:#1D9E75}.bbtn.no{background:#D85A30}
.bbtn:hover{opacity:.9}
.port{padding:14px 16px}
.pstats{display:flex;gap:20px;margin-bottom:16px;padding-bottom:14px;border-bottom:.5px solid var(--color-border-tertiary);flex-wrap:wrap}
.psv{font-size:22px;font-weight:500;color:var(--color-text-primary)}
.psl{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.pcard{border:.5px solid var(--color-border-tertiary);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.pcard:hover{border-color:var(--color-border-secondary)}
.pct{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pb2{font-size:11px;font-weight:500;padding:2px 8px;border-radius:100px}
.pb2.yes{background:#E1F5EE;color:#085041}.pb2.no{background:#FAECE7;color:#993C1D}
.pcq{font-size:12px;color:var(--color-text-primary);line-height:1.4;flex:1}
.pcb{display:flex;justify-content:space-between;font-size:12px}
.pcs{color:var(--color-text-tertiary)}
.ppos{color:#1D9E75;font-weight:500}.pneg{color:#D85A30;font-weight:500}
.empty{text-align:center;padding:40px 16px;color:var(--color-text-tertiary);font-size:14px;line-height:1.7}
.toast-z{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.toast{background:var(--color-background-primary);border:.5px solid var(--color-border-secondary);border-radius:10px;padding:9px 16px;font-size:13px;color:var(--color-text-primary);opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
@media (max-width:560px){.dbody{grid-template-columns:1fr}}
@media (prefers-color-scheme:dark){
  .pbadge{background:#04342C;border-color:#0F6E56;color:#9FE1CB}
  .cat.on{background:#26215C;border-color:#534AB7;color:#CECBF6}
  .mcb.pol{background:#26215C;color:#CECBF6}.mcb.esp{background:#04342C;color:#9FE1CB}
  .mcb.cri{background:#412402;color:#FAC775}.mcb.fin{background:#042C53;color:#B5D4F4}
  .mcb.tec{background:#4A1B0C;color:#F5C4B3}.mcb.sci{background:#4B1528;color:#F4C0D1}
  .out.yes{color:#5DCAA5}.out.no{color:#F0997B}
  .pb2.yes{background:#04342C;color:#9FE1CB}.pb2.no{background:#4A1B0C;color:#F5C4B3}
}
</style>

<div class="pm">
  <nav class="pnav">
    <span class="plogo"><span class="plogo-dot"></span>PredictBR</span>
    <button class="ptab" id="tab-m" onclick="go('markets')">Mercados</button>
    <button class="ptab" id="tab-p" onclick="go('portfolio')">Portfólio</button>
    <button class="ptab" onclick="showToast('Leaderboard em breve!')">Ranking</button>
    <div class="pnav-r">
      <span class="pbadge" id="bal-el">USDC 500,00</span>
      <button class="pwbtn">0x3f1a...42cc</button>
    </div>
  </nav>

  <div id="v-m">

      <input class="sinput" placeholder="Buscar mercados..." oninput="filterM(this.value)" id="srch">

  </div>

  <div id="v-d">

    <div class="dhead">

      <div class="dmeta">
        <span id="d-cb"></span>
        <span class="dyp" id="d-yp"></span>

    </div>
    <div class="dbody">
      <div class="dleft">
        <div class="slbl">Probabilidade</div>
        <div class="tbrow">
          <button class="tbtn" id="tb1" onclick="setT('1D',24)">1D</button>
          <button class="tbtn" id="tb7" onclick="setT('7D',56)">7D</button>
          <button class="tbtn on" id="tb30" onclick="setT('30D',120)">30D</button>

        <div><div class="psv" id="ppc">0</div><div class="psl">Posições abertas</div></div>

  <div class="toast-z"><div class="toast" id="toast"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const MKT = [
  {id:1,q:'Brasil será campeão na Copa do Mundo 2026?',cat:'Esportes',cls:'esp',p:19,vol:8400000,end:'Jul 2026'},
  {id:2,q:'Bitcoin ultrapassará US$150k em 2026?',cat:'Cripto',cls:'cri',p:41,vol:12700000,end:'Dez 2026'},
  {id:3,q:'Lula aprovará reforma tributária até Jun 2026?',cat:'Política',cls:'pol',p:58,vol:3200000,end:'Jun 2026'},
  {id:4,q:'Nubank atingirá 120M de clientes em 2026?',cat:'Finanças',cls:'fin',p:67,vol:1800000,end:'Dez 2026'},
  {id:5,q:'Ethereum ultrapassará US$10k em 2026?',cat:'Cripto',cls:'cri',p:29,vol:9300000,end:'Dez 2026'},
  {id:6,q:'Inflação brasileira ficará abaixo de 4% em 2026?',cat:'Finanças',cls:'fin',p:44,vol:2100000,end:'Dez 2026'},
  {id:7,q:'Neymar se aposentará do futebol em 2026?',cat:'Esportes',cls:'esp',p:23,vol:960000,end:'Dez 2026'},
  {id:8,q:'Apple lançará iPhone dobrável em 2026?',cat:'Tecnologia',cls:'tec',p:38,vol:4600000,end:'Set 2026'},
  {id:9,q:'EUA e China fecharão acordo comercial em 2026?',cat:'Política',cls:'pol',p:31,vol:7800000,end:'Dez 2026'},
  {id:10,q:'Petrobras pagará dividendos acima de R$4/ação?',cat:'Finanças',cls:'fin',p:62,vol:3400000,end:'Dez 2026'},
  {id:11,q:'Fed cortará juros pelo menos 3 vezes em 2026?',cat:'Finanças',cls:'fin',p:52,vol:15200000,end:'Dez 2026'},
  {id:12,q:'IA substituirá 10% dos empregos de TI em 2026?',cat:'Tecnologia',cls:'tec',p:34,vol:2900000,end:'Dez 2026'},
];
const CATS = ['Todos','Esportes','Cripto','Política','Finanças','Tecnologia'];
let S = {view:'markets',sid:null,cat:'Todos',search:'',bal:500,positions:[],outcome:'YES',trType:'buy',chart:null,obi:null};

const gm = () => MKT.find(m=>m.id===S.sid);
const fvol = v => v>=1e6 ? 'Vol: $'+(v/1e6).toFixed(1)+'M' : 'Vol: $'+(v/1e3).toFixed(0)+'K';

function go(view, id){
  if(id) S.sid=id;
  S.view=view;
  if(S.obi){clearInterval(S.obi);S.obi=null;}
  ['v-m','v-d','v-p'].forEach(v=>document.getElementById(v).style.display='none');
  const map={markets:'v-m',detail:'v-d',portfolio:'v-p'};
  document.getElementById(map[view]).style.display='';
  document.getElementById('tab-m').classList.toggle('on',view==='markets'||view==='detail');
  document.getElementById('tab-p').classList.toggle('on',view==='portfolio');
  if(view==='detail') initDetail();
  if(view==='portfolio') renderPort();
}

function renderCats(){
  const el=document.getElementById('cats');
  el.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.className='cat'+(S.cat===c?' on':'');
    b.textContent=c;
    b.onclick=()=>{S.cat=c;renderCats();renderGrid();};
    el.appendChild(b);
  });
}

function filterM(q){S.search=q;renderGrid();}

function renderGrid(){
  const el=document.getElementById('grid');
  const filtered=MKT.filter(m=>{
    const mc=S.cat==='Todos'||m.cat===S.cat;
    const ms=m.q.toLowerCase().includes(S.search.toLowerCase())||m.cat.toLowerCase().includes(S.search.toLowerCase());
    return mc&&ms;
  });
  if(!filtered.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--color-text-tertiary);font-size:14px">Nenhum mercado encontrado.</div>';return;}
  el.innerHTML=filtered.map(m=>`
    <div class="mcard" onclick="go('detail',${m.id})">
      <div class="mc-head"><span class="mcb ${m.cls}">${m.cat}</span><span class="mc-live">Ativo</span></div>
      <div class="mc-q">${m.q}</div>
      <div class="mc-bar"><div class="mc-fill" style="width:${m.p}%"></div></div>
      <div class="mc-bot">
        <div><span class="mc-yes">${m.p}% SIM</span><span class="mc-no"> ${100-m.p}% NÃO</span></div>
        <span class="mc-vol">${fvol(m.vol)}</span>
      </div>
    </div>`).join('');
}

function initDetail(){
  const m=gm(); if(!m) return;
  document.getElementById('dq').textContent=m.q;
  document.getElementById('d-yp').textContent=m.p+'% SIM';
  document.getElementById('d-np').textContent=(100-m.p)+'% NÃO';
  document.getElementById('d-vol').textContent=fvol(m.vol);
  document.getElementById('d-end').textContent='Encerra: '+m.end;
  const cb=document.getElementById('d-cb');
  cb.className='mcb '+m.cls; cb.textContent=m.cat;
  S.outcome='YES'; S.trType='buy';
  document.getElementById('amt').value='';
  document.querySelectorAll('.trt').forEach((e,i)=>e.classList.toggle('on',i===0));
  document.getElementById('oyes').classList.add('on'); document.getElementById('ono').classList.remove('on');
  document.getElementById('bbtn').textContent='Comprar SIM'; document.getElementById('bbtn').className='bbtn yes';
  updS();
  setT('30D',120);
  renderOB();
  S.obi=setInterval(renderOB,2200);
}

function genH(p,steps,seed){
  let v=Math.max(5,Math.min(95,p+((seed*7+3)%30)-15));
  const arr=[];
  for(let i=steps;i>=0;i--){
    const n=(Math.sin(i*seed*0.31)*3.8)+(Math.cos(i*0.73)*2.2);
    v+=n*0.45+(p-v)*0.04;
    v=Math.max(2,Math.min(98,v));
    arr.push(Math.round(v*10)/10);
  }
  arr[arr.length-1]=p;
  return arr;
}

function setT(label,steps){
  ['tb1','tb7','tb30'].forEach(id=>document.getElementById(id).classList.remove('on'));
  const map={'1D':'tb1','7D':'tb7','30D':'tb30'};
  document.getElementById(map[label]).classList.add('on');
  const m=gm(); if(!m) return;
  const data=genH(m.p,steps,m.id);
  if(S.chart){
    S.chart.data.datasets[0].data=data;
    S.chart.data.labels=data.map((_,i)=>{
      if(label==='1D') return i%6===0?i+'h':'';
      if(label==='7D') return i%8===0?'d'+(Math.ceil((steps-i)/8)):'';
      return i%15===0?Math.ceil((steps-i)/4)+'d':'';
    });
    S.chart.update('none');
  } else {
    initChart(m,data,label,steps);
  }
}

function initChart(m,data,label,steps){
  if(S.chart){S.chart.destroy();S.chart=null;}
  const canvas=document.getElementById('pc');
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const gc=dark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
  const tc=dark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
  const labels=data.map((_,i)=>{
    if(label==='1D') return i%6===0?i+'h':'';
    if(label==='7D') return i%8===0?'d'+(Math.ceil((steps-i)/8)):'';
    return i%15===0?Math.ceil((steps-i)/4)+'d':'';
  });
  S.chart=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels,datasets:[{data,borderColor:'#1D9E75',borderWidth:1.5,pointRadius:0,tension:0.35,fill:false}]},
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.parsed.y.toFixed(1)+'%'}}},
      scales:{
        x:{grid:{color:gc},ticks:{color:tc,font:{size:10},maxRotation:0},border:{display:false}},
        y:{min:0,max:100,grid:{color:gc},ticks:{color:tc,font:{size:10},callback:v=>v+'%'},border:{display:false}}
      }
    }
  });
}

function renderOB(){
  const m=gm(); if(!m) return;
  const p=m.p/100;
  const asks=[],bids=[];
  for(let i=1;i<=5;i++){
    const pr=Math.min(0.99,p+i*0.012+(Math.random()*0.004));
    const q=Math.round(300+Math.random()*2500);
    asks.push({pr,q});
  }
  asks.reverse();
  for(let i=1;i<=5;i++){
    const pr=Math.max(0.01,p-i*0.012-(Math.random()*0.004));
    const q=Math.round(300+Math.random()*2500);
    bids.push({pr,q});
  }
  const row=(r,cls)=>`<div class="obr"><span class="${cls}">${(r.pr*100).toFixed(1)}¢</span><span style="color:var(--color-text-secondary)">${r.q.toLocaleString('pt-BR')}</span><span style="color:var(--color-text-tertiary)">${Math.round(r.pr*r.q)}</span></div>`;
  document.getElementById('asks').innerHTML=asks.map(r=>row(r,'oask')).join('');
  document.getElementById('bids').innerHTML=bids.map(r=>row(r,'obid')).join('');
  const spread=((asks[asks.length-1].pr-bids[0].pr)*100).toFixed(1);
  document.getElementById('obmid').textContent=m.p+'% — spread: '+spread+'¢';
}

function setTT(t,el){
  S.trType=t;
  document.querySelectorAll('.trt').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  updBtn();
}

function setO(o){
  S.outcome=o;
  document.getElementById('oyes').classList.toggle('on',o==='YES');
  document.getElementById('ono').classList.toggle('on',o==='NO');
  updBtn(); updS();
}

function updBtn(){
  const btn=document.getElementById('bbtn');
  const lbl=(S.trType==='buy'?'Comprar ':'Vender ')+(S.outcome==='YES'?'SIM':'NÃO');
  btn.textContent=lbl; btn.className='bbtn '+(S.outcome==='YES'?'yes':'no');
}

function sA(v){document.getElementById('amt').value=v;updS();}

function updS(){
  const m=gm();
  const amt=parseFloat(document.getElementById('amt').value)||0;
  if(!m||amt<=0){['tp','ts','tpr'].forEach(id=>document.getElementById(id).textContent='—');return;}
  const price=S.outcome==='YES'?m.p/100:(100-m.p)/100;
  const shares=amt/price;
  const profit=shares-amt;
  document.getElementById('tp').textContent=(price*100).toFixed(1)+'¢';
  document.getElementById('ts').textContent=shares.toFixed(2);
  document.getElementById('tpr').textContent='+'+(profit.toFixed(2))+' USDC';
}

function execTrade(){
  const m=gm();
  const amt=parseFloat(document.getElementById('amt').value)||0;
  if(!m||amt<=0){showToast('Insira um valor para continuar.');return;}
  if(amt>S.bal){showToast('Saldo insuficiente.');return;}
  S.bal-=amt;
  const price=S.outcome==='YES'?m.p/100:(100-m.p)/100;
  const shares=amt/price;
  S.positions.push({mktId:m.id,q:m.q,outcome:S.outcome,shares,avgP:price,invested:amt,cp:m.p});
  document.getElementById('bal-el').textContent='USDC '+S.bal.toFixed(2);
  document.getElementById('amt').value='';
  updS();
  showToast(shares.toFixed(2)+' shares '+(S.outcome==='YES'?'SIM':'NÃO')+' comprados por $'+amt.toFixed(2));
}

function renderPort(){
  const tv=S.positions.reduce((a,p)=>{const pr=p.outcome==='YES'?p.cp/100:(100-p.cp)/100;return a+p.shares*pr;},0);
  const ti=S.positions.reduce((a,p)=>a+p.invested,0);
  const pnl=tv-ti;
  document.getElementById('pv').textContent='$'+tv.toFixed(2);
  document.getElementById('ppnl').textContent=(pnl>=0?'+':'')+pnl.toFixed(2)+' USDC';
  document.getElementById('ppnl').style.color=pnl>=0?'#1D9E75':'#D85A30';
  document.getElementById('ppc').textContent=S.positions.length;
  const el=document.getElementById('poslist');
  if(!S.positions.length){el.innerHTML='<div class="empty">Nenhuma posição ainda.<br>Explore os mercados e faça sua primeira aposta.</div>';return;}
  el.innerHTML=S.positions.map((p,i)=>{
    const pr=p.outcome==='YES'?p.cp/100:(100-p.cp)/100;
    const cv=p.shares*pr;
    const pnl=cv-p.invested;
    const pct=(pnl/p.invested*100).toFixed(1);
    return `<div class="pcard" onclick="go('detail',${p.mktId})">
      <div class="pct"><span class="pb2 ${p.outcome.toLowerCase()}">${p.outcome==='YES'?'SIM':'NÃO'}</span><span class="pcq">${p.q}</span></div>
      <div class="pcb"><span class="pcs">${p.shares.toFixed(2)} shares @ ${(p.avgP*100).toFixed(1)}¢</span><span class="${pnl>=0?'ppos':'pneg'}">${pnl>=0?'+':''}$${pnl.toFixed(2)} (${pnl>=0?'+':''}${pct}%)</span></div>
    </div>`;
  }).join('');
}

let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),3000);
}

go('markets');
renderCats();
renderGrid();
</script>
